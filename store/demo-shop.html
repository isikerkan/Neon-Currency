<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;font:16px system-ui,Segoe UI,Roboto,sans-serif;background:#f4f5f7;color:#1d2330}
header{background:#1d2330;color:#fff;padding:18px 48px;font-weight:700;font-size:20px;display:flex;gap:28px;align-items:center}
header span{font-weight:400;font-size:15px;opacity:.7}
main{padding:36px 48px;display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.card{background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.06);overflow:hidden}
.img{height:190px;background:linear-gradient(135deg,var(--a),var(--b))}
.body{padding:16px 18px}
.t{font-weight:600;margin-bottom:6px}.d{color:#6b7385;font-size:14px;margin-bottom:12px}
.price{font-size:22px;font-weight:700;color:#0b6b3a}
.btn{float:right;background:#1d2330;color:#fff;border-radius:8px;padding:6px 12px;font-size:14px}
</style></head><body>
<header>example-shop.com <span>Electronics</span><span>Games</span><span>Accessories</span></header>
<main>
<div class="card"><div class="img" style="--a:#7dd3fc;--b:#a78bfa"></div><div class="body"><div class="t">Wireless Headphones</div><div class="d">Noise cancelling, 30 h battery</div><span class="btn">Add to cart</span><span class="price" id="p1">$249.99</span></div></div>
<div class="card"><div class="img" style="--a:#fda4af;--b:#fcd34d"></div><div class="body"><div class="t">Mechanical Keyboard</div><div class="d">Hot-swap, RGB, ISO layout</div><span class="btn">Add to cart</span><span class="price" id="p2">€129,00</span></div></div>
<div class="card"><div class="img" style="--a:#86efac;--b:#67e8f9"></div><div class="body"><div class="t">4K Monitor 27"</div><div class="d">IPS, 144 Hz, USB-C 90 W</div><span class="btn">Add to cart</span><span class="price" id="p3">£389.00</span></div></div>
</main></body></html>
