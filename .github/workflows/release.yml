name: Release

# Runs after every merge to main, on a pushed v* tag, or manually
# (Actions → Release → Run workflow).
# On main / manual runs: if v<manifest version> is already released, the patch version
# is bumped and committed to main ("Release vX.Y.Z [skip ci]"), then that commit is tagged.
# A PR that bumps the version itself is released with exactly that version.
# After the GitHub release, the zip is uploaded to the Chrome Web Store when the
# CWS_* variables/secrets are configured (see docs/DEVELOPMENT.md → Chrome Web Store).
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_to_store:
        description: "Upload to the Chrome Web Store and submit for review"
        type: boolean
        default: true

permissions:
  contents: write

# Serialize releases so two quick merges cannot claim the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
      zip: ${{ steps.build.outputs.zip }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Branch tip, not the triggering commit: a later merge may already be on main.
          ref: ${{ github.ref_type == 'branch' && github.ref_name || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve version (bump patch if already released)
        id: tag
        run: |
          version=$(jq -r .version manifest.json)

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
              echo "manifest.json version v${version} does not match tag ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
          elif git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            version=$(node -e '
              const parts = process.argv[1].split(".").map(Number);
              while (parts.length < 3) parts.push(0);
              parts[parts.length - 1] += 1;
              console.log(parts.join("."));
            ' "${version}")
            jq --arg v "${version}" '.version = $v' manifest.json > manifest.tmp && mv manifest.tmp manifest.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Release v${version} [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "Bumped manifest.json to ${version}"
          fi

          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Static checks
        run: node scripts/check.mjs

      - name: Unit tests
        run: node --test tests/*.test.mjs

      - name: Build extension zip
        id: build
        run: echo "zip=$(bash scripts/build.sh)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: card-currency-extension
          path: ${{ steps.build.outputs.zip }}
          if-no-files-found: error

  github-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: card-currency-extension
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          gh release create "${TAG}" dist/*.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${SHA}" \
            --title "Card Currency Converter ${TAG}" \
            --generate-notes

  chrome-web-store:
    needs: [build, github-release]
    if: vars.CWS_EXTENSION_ID != '' && (github.event_name == 'push' || inputs.publish_to_store)
    runs-on: ubuntu-latest
    environment: chrome-web-store
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: card-currency-extension
          path: dist

      - name: Upload and submit for review
        env:
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: bash scripts/publish-cws.sh dist/*.zip
