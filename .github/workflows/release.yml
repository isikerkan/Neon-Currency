name: Release

# Runs on a pushed v* tag, or manually (Actions → Release → Run workflow):
# the manual run tags the selected commit with v<manifest version>.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        run: |
          manifest_tag="v$(jq -r .version manifest.json)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "${manifest_tag}" ]; then
            echo "manifest.json version ${manifest_tag} does not match tag ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          echo "TAG=${manifest_tag}" >> "$GITHUB_ENV"

      - name: Build extension zip
        run: |
          mkdir -p dist
          zip -r "dist/neon-currency-${TAG}.zip" manifest.json src README.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${TAG}" "dist/neon-currency-${TAG}.zip" \
            --target "${GITHUB_SHA}" \
            --title "Neon Currency ${TAG}" \
            --generate-notes
