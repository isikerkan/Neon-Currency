name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check manifest version matches tag
        run: |
          manifest_version=$(jq -r .version manifest.json)
          if [ "v${manifest_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "manifest.json version ${manifest_version} does not match tag ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Build extension zip
        run: |
          mkdir -p dist
          zip -r "dist/neon-currency-${GITHUB_REF_NAME}.zip" manifest.json src README.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "dist/neon-currency-${GITHUB_REF_NAME}.zip" \
            --title "Neon Currency ${GITHUB_REF_NAME}" \
            --generate-notes
